<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>봉사 활동 신청</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>1365 봉사시간 신청</h1>

    <section id="form-view">
      <p id="location-status" class="status" role="status">위치를 확인하고 있어요…</p>
      <button type="button" id="retry-location" class="secondary" hidden>위치 다시 확인</button>

      <form id="apply-form" novalidate>
        <label for="name">이름</label>
        <input id="name" name="name" autocomplete="name" maxlength="20" required>

        <label for="birth">생년월일</label>
        <input id="birth" name="birth" inputmode="numeric" placeholder="95.03.12" maxlength="8" required>

        <label for="phone">연락처</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-1234-5678" maxlength="13" required>

        <fieldset>
          <legend>활동시간 <span id="time-rule" class="hint"></span></legend>
          <div class="time-row">
            <select id="start-time" aria-label="시작 시각" required disabled>
              <option value="">시작</option>
            </select>
            <span>~</span>
            <select id="end-time" aria-label="종료 시각" required disabled>
              <option value="">종료</option>
            </select>
          </div>
          <p id="time-total" class="hint">불러오는 중…</p>
        </fieldset>

        <!-- 활동일지 양식 하단의 개인정보 제공 동의 문구를 그대로 옮겨 적는다 (PRD 4.1) -->
        <div class="consent">
          <p>
            본인은 1365 자원봉사 실적 등록을 위해 위 개인정보(이름, 생년월일, 연락처)를
            자원봉사센터에 제공하는 것에 동의합니다.
          </p>
          <label class="check">
            <input type="checkbox" id="consent" name="consent" required>
            개인정보 제공에 동의합니다 (필수)
          </label>
        </div>

        <p id="form-error" class="error" role="alert" hidden></p>
        <button type="submit" id="submit" disabled>제출하기</button>
      </form>
    </section>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <h2 id="confirm-title">제출 내용 확인</h2>
      <dl id="confirm-summary"></dl>
      <p>위 내용으로 제출하시겠습니까?<br><strong>제출 후에는 수정할 수 없습니다.</strong></p>
      <div class="dialog-buttons">
        <button type="button" id="confirm-cancel" class="secondary">취소</button>
        <button type="button" id="confirm-ok">제출하기</button>
      </div>
    </dialog>

    <section id="done-view" hidden>
      <p class="done-mark">✓</p>
      <h2>제출했어요</h2>
      <p id="done-message"></p>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
